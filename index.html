<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine Story for Farah Fae</title>
  <link rel="stylesheet" href="rue.css" />
</head>
<body>

  <audio id="bgMusic" loop>
    <source src="wishlist.mp3" type="audio/mpeg" />
  </audio>

  <!-- Start overlay -->
  <div id="startOverlay">
    <img id="startHeart" src="heart3.gif" alt="Heart" />
    <h1>💖 Click the Heart 💖</h1>
  </div>

  <!-- Story container -->
  <div id="storyContainer">
    <h1 id="storyTitle"></h1>
    <p id="storyText"></p>
    <div id="questionContainer">
      <button class="choiceBtn" id="yesBtn">Yes 💖</button>
      <button class="choiceBtn" id="noBtn">No 😢</button>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
